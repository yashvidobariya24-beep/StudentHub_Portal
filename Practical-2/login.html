<section>

<center>

<h2>Welcome Back</h2>

<p>
    Don't have an active account yet? 
    <a href="Signup.html">Create Account Here</a>
</p>

<!-- <form action="dashboard.html"> -->
    <!-- <form action="Dashborad.html?login=success"> --> 
        <form action="Dashborad.html" method="get">  
             <input type="hidden" name="login" value="success">    


    <table>

        <tr>
            <td><label for="useremail">Email Address</label></td>
            <td>
                <input type="email" id="useremail" placeholder="Enter Your Email ID" required>
            </td>
        </tr>

        <tr>
            <td><label for="userpass">Password</label></td>
            <td>
                <div class="password-box">
                    <input type="password" id="userpass" placeholder="Enter Account Password" required>
                </div>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="right">
                <a href="#">Forgot Password?</a>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="checkbox" id="rememberme">
                <label for="rememberme">Keep Me Signed In</label>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <button type="submit">Sign In</button>
                <button type="reset">Reset</button>
            </td>
        </tr>

    </table>

</form>

</center>

</section>

</main>
